name: Setup branch protection (main)
# NOTE:
# - 既定の GITHUB_TOKEN には branch protection を設定する権限がないため、
#   このワークフローを実行するには `repo` (or fine-grained `Administration: Write`)
#   を持つ PAT をリポジトリ secret `PROTECTION_PAT` に登録する必要がある。
# - Organization Ruleset で main を一括保護している場合（BRANCHING.md §4 推奨）
#   は本ワークフローは不要なので削除してよい。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROTECTION_PAT }}
          script: |
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: { strict: true, contexts: [] },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 0,
                dismiss_stale_reviews: true,
              },
              restrictions: null,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false,
            });
            console.log('Branch protection applied to main');
